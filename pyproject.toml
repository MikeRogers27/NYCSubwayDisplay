[project]
name = "nyc-subway-display"
version = "0.1.0"
description = "LED subway display with MTA, weather, and sports integrations"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anyio==4.8.0",
    "certifi==2024.12.14",
    "charset-normalizer==3.4.1",
    "geojson==2.5.0",
    "h11==0.14.0",
    "holidays==0.63",
    "httpcore==1.0.7",
    "httpx==0.28.1",
    "idna==3.10",
    "nyct-gtfs==2.0.0",
    "pillow==11.1.0",
    "protobuf==4.25.3",
    "pyowm==3.5.0",
    "PySocks==1.7.1",
    "python-dateutil==2.9.0.post0",
    "pytz==2024.2",
    "requests==2.32.3",
    "six==1.17.0",
    "sniffio==1.3.1",
    "typing_extensions==4.12.2",
    "urllib3==2.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "RGBMatrixEmulator==0.11.6; platform_system == 'Windows'",
]

[project.optional-dependencies]
pi = [
    "rgbmatrix; sys_platform == 'linux'",
]

[tool.uv]
package = false

[tool.uv.sources]
rgbmatrix = { path = "../rpi-rgb-led-matrix/bindings/python", editable = true, marker = "sys_platform == 'linux'" }